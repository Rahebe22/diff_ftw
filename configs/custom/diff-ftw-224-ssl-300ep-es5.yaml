trainer:
  max_epochs: 300
  log_every_n_steps: 10
  accelerator: cuda
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  default_root_dir: /home/ubuntu/working/models/diffusion_ssl_300ep_es5
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: '{epoch}-{val_loss:.4f}'
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 5
        min_delta: 0.0

model:
  class_path: ftw_ma.diffusion_task.FTWDiffusionSSLTask
  init_args:
    in_channels: 4
    lr: 2e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    timesteps: 1000
    noise_schedule: cosine
    beta_start: 1e-6
    beta_end: 0.02
    cosine_s: 0.008
    max_beta: 0.999
    loss: mse
    min_snr_gamma: 5.0
    centered_inputs: true
    ema_decay: 0.9999
    use_ema_for_validation: true
    val_timestep_bins: 10
    export_encoder_on_train_end: true
    model: ftw_efficientnet
    backbone: efficientnet-b7
    weights: true
    scheduler: cosinewarm
    t_0: 30
    t_mult: 2
    eta_min: 1e-5
    model_kwargs:
      time_embedding_dim: 128
      time_condition_dim: 512

data:
  class_path: ftw_ma.ssl_datamodule.FTWMapAfricaSSLDataModule
  init_args:
    batch_size: 20
    num_workers: 4
    pin_memory: true
    prefetch_factor: 4
    drop_last_train: true
    num_samples: -1
    data_dir: /mnt/s3_pretrain
    catalog: /mnt/s3_pretrain/catalog_train_validate_80_20.csv
    split_column: usage
    img_path_cols: [image]
    crop_size: null
    use_augmentations: false
    normalization_strategy: min_max
    normalization_stat_procedure: lab
    global_stats: null
    img_clip_val: 0
    nodata: []
