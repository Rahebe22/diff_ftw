trainer:
  max_epochs: 300
  limit_val_batches: 200
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  accelerator: cuda
  devices: [0, 1, 2]
  strategy: ddp_find_unused_parameters_true
  use_distributed_sampler: false
  precision: 32-true
  gradient_clip_val: 1.0
  sync_batchnorm: false
  default_root_dir: ./work_dir/diffusion_ssl_300ep_es5_2
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: link
        save_weights_only: true
        filename: '{epoch}-{val_loss:.4f}'
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 5
        min_delta: 0.0
    - class_path: ftw_ma.diagnostics.DDPProgressDiagnostics
      init_args:
        output_dir: /mnt/ebs_pretrain/model_outputs/diffusion_ssl_300ep_es5/ddp_diagnostics
        log_every_n_steps: 500
        heartbeat_seconds: 60

model:
  class_path: ftw_ma.diffusion_task.FTWDiffusionSSLTask
  init_args:
    in_channels: 4
    lr: 1e-5
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    timesteps: 1000
    noise_schedule: cosine
    beta_start: 1e-6
    beta_end: 0.02
    cosine_s: 0.008
    max_beta: 0.999
    min_timestep: 100
    loss: mse
    min_snr_gamma: 5.0
    centered_inputs: true
    ema_decay: 0.9999
    use_ema_for_validation: false
    freeze_batchnorm_stats: true
    val_timestep_bins: 10
    export_encoder_on_train_end: true
    export_encoder_use_ema: false
    model: ftw_efficientnet
    backbone: efficientnet-b7
    weights: true
    scheduler: cosinewarm
    t_0: 30
    t_mult: 2
    eta_min: 1e-5
    model_kwargs:
      time_embedding_dim: 128
      time_condition_dim: 512

data:
  class_path: ftw_ma.ssl_datamodule.FTWMapAfricaSSLDataModule
  init_args:
    batch_size: 20
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    drop_last_train: true
    num_samples: -1
    data_dir: /mnt/ebs_pretrain
    catalog: /mnt/ebs_pretrain/catalog_train_validate_80_20.csv
    catalog_cache_dir: /mnt/ebs_pretrain/ssl_catalog_cache
    loader_startup_diagnostics: true
    loader_startup_log_interval_seconds: 30
    skip_bad_images: true
    image_read_timeout_seconds: 60
    max_image_read_retries: 8
    split_column: usage
    img_path_cols: [image]
    crop_size: null
    use_augmentations: false
    normalization_strategy: min_max
    normalization_stat_procedure: lab
    global_stats: null
    img_clip_val: 0
    nodata: []
    use_constant_memory_sampler: true
