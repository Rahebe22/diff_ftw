trainer:
  max_epochs: 80
  log_every_n_steps: 10
  accelerator: cuda
  devices: [0, 1, 2]
  strategy: ddp_find_unused_parameters_true
  default_root_dir: ./work_dir/train
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: '{epoch}-{val_loss:.2f}'

model:
  class_path: ftw_ma.trainers.CustomSemanticSegmentationTask
  init_args:
    class_weights: [0.05, 0.2, 0.75]
    loss: localtversky
    model: unet
    backbone: efficientnet-b7
    weights: true
    patch_weights: false
    in_channels: 4
    num_classes: 3
    num_filters: 64
    ignore_index: 3
    lr: 1e-3
    patience: 100

data:
  class_path: ftw_ma.datamodule.FTWMapAfricaDataModule
  init_args:
    temporal_options: windowB
    batch_size: 32
    num_workers: 4
    num_samples: -1
    data_dir: /home/airg/data/labels/cropland
    catalog: /home/airg/rabedi/thesis/ftw-mappingafrica-integration/croplands3-2.1.1_finetune_all_samples_ftw.csv
    crop_size: 224
    normalization_strategy: min_max
    normalization_stat_procedure: lab
    random_shuffle: false
    global_stats:
      min: [203.5]
      max: [4590.4]
    img_clip_val: 0
